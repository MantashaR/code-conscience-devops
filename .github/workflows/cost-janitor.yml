name: Cost Janitor

# Runs on every PR (the gate the spec asks for) and on pushes to main (so we
# always have a recent artifact). workflow_dispatch lets a human re-run on
# demand.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write  # needed to comment on PRs

jobs:
  scan:
    name: Apply Terraform + run Janitor
    runs-on: ubuntu-latest

    # LocalStack runs as a service container so the steps below can talk to it
    # at http://localhost:4566 just like a real account.
    services:
      localstack:
        image: localstack/localstack:3
        ports:
          - 4566:4566
        env:
          SERVICES: ec2,s3,sts,iam
          DEBUG: "0"
          LS_LOG: warn
        options: >-
          --health-cmd="curl -sf http://localhost:4566/_localstack/health || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    env:
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: janitor/requirements-dev.txt

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Install Python deps
        run: |
          pip install --quiet -r janitor/requirements-dev.txt

      - name: Wait for LocalStack to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4566/_localstack/health > /dev/null; then
              echo "LocalStack ready on attempt $i"
              exit 0
            fi
            echo "Waiting for LocalStack ($i/30)..."
            sleep 2
          done
          echo "::error::LocalStack never became healthy"
          curl -v http://localhost:4566/_localstack/health || true
          exit 1

      - name: terraform fmt -check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: terraform validate
        working-directory: terraform
        run: |
          terraform init -backend=false
          terraform validate

      - name: terraform apply (LocalStack)
        working-directory: terraform
        # The provider.tf in this repo already routes every AWS service call to
        # var.localstack_endpoint, so plain `terraform` works against LocalStack
        # without the tflocal wrapper (which was double-configuring endpoints
        # via env vars and conflicting with the provider's endpoints {} block).
        run: |
          terraform init
          terraform apply -auto-approve

      - name: Janitor unit tests
        working-directory: janitor
        # Unit tests run against moto, no LocalStack needed. We run them in CI
        # so a broken refactor still trips the gate.
        env:
          AWS_ENDPOINT_URL: ""
        run: python -m pytest tests/ -v

      - name: Run Cost Janitor (dry-run)
        id: janitor
        working-directory: janitor
        run: |
          set +e
          python janitor.py --dry-run --region us-east-1 --endpoint "$AWS_ENDPOINT_URL" --output-dir output
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "Janitor exited with code $code"

      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cost-janitor-report
          path: |
            janitor/output/report.json
            janitor/output/report.md
          if-no-files-found: warn

      - name: Comment on PR with orphan summary
        if: github.event_name == 'pull_request' && steps.janitor.outputs.exit_code == '2'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- cost-janitor-comment -->';
            const md = fs.readFileSync('janitor/output/report.md', 'utf8');
            const body = `${marker}\n## :rotating_light: Cost Janitor flagged orphan resources\n\n${md}\n\n_Updated by \`.github/workflows/cost-janitor.yml\` on each push._`;

            const { data: existing } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const previous = existing.find(c => c.body && c.body.includes(marker));

            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail the workflow if orphans were found
        if: steps.janitor.outputs.exit_code == '2'
        run: |
          echo "::warning::Cost Janitor reported orphan resources. See the artifact and PR comment for details."
          exit 1

      - name: Fail the workflow on Janitor runtime error
        if: steps.janitor.outputs.exit_code != '0' && steps.janitor.outputs.exit_code != '2'
        run: |
          echo "::error::Cost Janitor crashed with exit code ${{ steps.janitor.outputs.exit_code }}."
          exit 1
